; 【PlatformIO项目配置文件】
;
; Arduino IDE 工具菜单介绍链接：https://docs.espressif.com/projects/arduino-esp32/en/latest/guides/tools_menu.html
; 
; platformio.ini 文件介绍链接：https://docs.platformio.org/en/latest/projectconf/index.html
; 
; ESP32平台配置文件介绍链接：https://docs.platformio.org/en/latest/platforms/espressif32.html
;
; 详细编译上传打印信息命令：pio run -v -t upload


[env:esp32-s3-devkitc-1]
platform = espressif32               ; 平台，一般默认为 espressif32
; 【修改】改为官方标准的开发板定义，避免识别不到自定义文件
board = esp32-s3-devkitc-1           ; 开发板型号或芯片型号
framework = arduino                  ; 软件框架，一般默认为 arduino


; 【修改】注释掉静态 COM 口，让 PlatformIO 自动识别
; upload_port = COM18                  ; 程序上传的端口号，如果已选择自动匹配端口号则注释这一行
; monitor_port = COM18                 ; 串口打印的端口号，如果已选择自动匹配端口号则注释这一行
monitor_speed = 115200               ; 串口打印的波特率
monitor_filters = esp32_exception_decoder


;---Platformio中的配置项对应ArduinoIDE中的开发板配置选项---;

;---CPU Frequency（CPU运行的频率）---;
board_build.f_cpu = 240000000L       ; 对应ArduinoIDE中的【240MHz(WiFi)】选项
; board_build.f_cpu = 160000000L       ; 对应ArduinoIDE中的【160MHz(WiFi)】选项
; board_build.f_cpu = 80000000L        ; 对应ArduinoIDE中的【80MHz(WiFi)】选项
; board_build.f_cpu = 40000000L        ; 对应ArduinoIDE中的【40MHz】选项
; board_build.f_cpu = 20000000L        ; 对应ArduinoIDE中的【20MHz】选项
; board_build.f_cpu = 10000000L        ; 对应ArduinoIDE中的【10MHz】选项


;---Erace All Flash Before Sketch Upload（指定上传新的程序之前是否擦除整个Flash）---;
; pio run -t erase          ; 对应ArduinoIDE中的【Enabled】选项  


;---Flash Mode（Flash的模式和频率）---;
board_build.flash_mode = qio           ; 对应ArduinoIDE中的【QIO 80MHz】选项
board_build.f_flash = 80000000L

; board_build.flash_mode = qio           ; 对应ArduinoIDE中的【QIO 120MHz】选项
; board_build.f_flash = 120000000L

; board_build.flash_mode = dio           ; 对应ArduinoIDE中的【DIO 80MHz】选项
; board_build.f_flash = 80000000L

; board_build.flash_mode = opi           ; 对应ArduinoIDE中的【OPI 80MHz】选项
; board_build.f_flash = 80000000L


;---Flash Size（Flash的大小）---;
; board_upload.flash_size = 4MB        ; 对应ArduinoIDE中的【4MB(32Mb)】选项
; board_upload.flash_size = 8MB        ; 对应ArduinoIDE中的【8MB(64Mb)】选项
board_upload.flash_size = 16MB       ; 对应ArduinoIDE中的【16MB(128Mb)】选项
; board_upload.flash_size = 32MB       ; 对应ArduinoIDE中的【32MB(256Mb)】选项


;---Partition Scheme（分区表）---;
; 常用分区表文件目录：C:\Users\[电脑用户名]\.platformio\packages\framework-arduinoespressif32\tools\partitions
; 【修改】锁定官方 16MB 默认分区表，最大化利用 N16R8 闪存
board_build.partitions = default_16MB.csv


;---PSRAM（内部或外部扩展RAM）---;
; ESP32-S3 SDK 目录：C:\Users\[电脑用户名]\.platformio\packages\framework-arduinoespressif32\tools\sdk\esp32s3   
; 以qio_opi为例，前者(qio)表示Falsh的编程模式和连接方式，后者(opi)表示PSRAM的编程模式和连接方式
; ESP32-S3的Falsh的编程模式和连接方式有：dio、qio、opi，一般为qio 
; ESP32-S3的PSRAM的编程模式和连接方式有：qspi、opi，2M内嵌PSRAM为qspi，8M内嵌PSRAM为opi
; 乐鑫ESP32-S3芯片/模组/开发板文档：https://www.espressif.com/zh-hans/products/socs/esp32-s3
      
; board_build.arduino.memory_type = qio_qspi         ; 对应ArduinoIDE中的【QSPI PSRAM】选项 
; 【修改】解除注释，必须开启 OPI 模式以点亮 N16R8 的 8MB PSRAM
board_build.arduino.memory_type = qio_opi          ; 对应ArduinoIDE中的【OPI PSRAM】选项 


;---Upload Speed（程序上传的波特率）---;
; board_upload.speed = 115200              ; 对应ArduinoIDE中的【115200】选项
; board_upload.speed = 230400              ; 对应ArduinoIDE中的【230400】选项
; board_upload.speed = 256000              ; 对应ArduinoIDE中的【256000】选项
; board_upload.speed = 512000              ; 对应ArduinoIDE中的【512000】选项
board_upload.speed = 921600              ; 对应ArduinoIDE中的【921600】选项


;---Upload Mode（程序上传模式）---;
; ESP32-S3支持多种程序上传方式，具体参考：https://docs.platformio.org/en/latest/boards/espressif32/esp32-s3-devkitc-1.html#uploading
upload_protocol = esptool                  ; 对应ArduinoIDE中的【UART0 / Hardware CDC】选项     


;---JTAG Adapter（指定JTAG适配器类型）---;
; ESP32-S3支持多种程序调试方式，具体参考：https://docs.platformio.org/en/latest/boards/espressif32/esp32-s3-devkitc-1.html#debugging
  ; -Ddebug_tool = custom                       ; 对应ArduinoIDE中的【Disabled】选项 
  ;                                             ; 对应ArduinoIDE中的【Integrated USB JTAG】选项  
  ;                                             ; 对应ArduinoIDE中的【FTDI Adapter】选项  
  ;                                             ; 对应ArduinoIDE中的【ESP USB Bridge】选项  


;---编译标志---;
build_flags = 
;---USB Mode（USB工作模式）---;
  -DARDUINO_USB_MODE=0                ; 对应ArduinoIDE中的【Hardware CDC and JTAG】选项 
  ; -DARDUINO_USB_MODE=0                ; 对应ArduinoIDE中的【USB-OTG (TinyUSB)】选项   

;---USB CDC On Boot（指定启动时是否使用 USB CDC）---;
  ; -DARDUINO_USB_CDC_ON_BOOT=0         ; 对应ArduinoIDE中的【Disabled】选项  
  ; 【修改】解除注释并设为 1，打通原生 USB Type-C 的 Serial 打印链路
  -DARDUINO_USB_CDC_ON_BOOT=0         ; 对应ArduinoIDE中的【Enabled】选项  

;---USB DFU On Boot（指定启动时是否使用启用 USB DFU）---;
  -DARDUINO_USB_DFU_ON_BOOT=1         ; 对应ArduinoIDE中的【Disabled】选项  
  ; -ARDUINO_USB_DFU_ON_BOOT=1          ; 对应ArduinoIDE中的【Enabled (Requires USB-OTG Mode)】选项  

;---USB Firmware MSC On Boot（指定启动时是否使用USB固件MSC）---;
  -DARDUINO_USB_MSC_ON_BOOT=0         ; 对应ArduinoIDE中的【Disabled】选项  
  ; -DARDUINO_USB_MSC_ON_BOOT=1         ; 对应ArduinoIDE中的【Enabled (Requires USB-OTG Mode)】选项  

;---Events Run On（指定事件处理器运行的核心）---;
  -DARDUINO_EVENT_RUNNING_CORE=1      ; 对应ArduinoIDE中的【Core 1】选项  
  ; -DARDUINO_EVENT_RUNNING_CORE=0      ; 对应ArduinoIDE中的【Core 0】选项  

;---Arduino Runs On（指定Arduino代码运行的核心）---;
  -DARDUINO_RUNNING_CORE=1            ; 对应ArduinoIDE中的【Core 1】选项  
  ; -DARDUINO_RUNNING_CORE=0            ; 对应ArduinoIDE中的【Core 0】选项  

;---Core Debug Level（指定调试级别）---;
  -DCORE_DEBUG_LEVEL=3                ; 对应ArduinoIDE中的【Info】选项（临时调试）  
  ; -DCORE_DEBUG_LEVEL=1                ; 对应ArduinoIDE中的【Error】选项  
  ; -DCORE_DEBUG_LEVEL=2                ; 对应ArduinoIDE中的【Warn】选项  
  ; -DCORE_DEBUG_LEVEL=3                ; 对应ArduinoIDE中的【Info】选项  
  ; -DCORE_DEBUG_LEVEL=4                ; 对应ArduinoIDE中的【Debug】选项  
  ; -DCORE_DEBUG_LEVEL=5                ; 对应ArduinoIDE中的【Verbose】选项  

;---PSRAM（内部或外部扩展RAM）
  ; 【修改】解除注释，在全局变量中使能 PSRAM 宏，这是分配 PSRAM 内存的必要条件
  -DBOARD_HAS_PSRAM                   ; 对应ArduinoIDE中的【Enabled】选项

;---TFT_eSPI 屏幕驱动配置宏---;
  -DUSER_SETUP_LOADED=1               ; 告诉 TFT_eSPI 库不要加载默认的 User_Setup.h
  -DILI9341_DRIVER=1                  ; 指定驱动 IC 为 ILI9341
  -DTFT_WIDTH=240                     ; 屏幕宽度
  -DTFT_HEIGHT=320                    ; 屏幕高度
  -DTFT_CS=10                         ; 对应屏幕 CS 引脚
  -DTFT_DC=9                          ; 对应屏幕 D/C 引脚
  -DTFT_RST=14                        ; 对应屏幕 RESET 引脚
  -DTFT_MOSI=11                       ; 对应屏幕 SDI(MOSI) 引脚
  -DTFT_SCLK=12                       ; 对应屏幕 SCK 引脚
  -DTFT_MISO=-1                       ; 不接 MISO 引脚
  -DLOAD_GLCD=1                       ; 加载基础字体
  -DLOAD_FONT2=1                      ; 加载内置字体 2
  -DLOAD_FONT4=1                      ; 加载内置字体 4
  -DSPI_FREQUENCY=40000000            ; 设置 SPI 频率为 40MHz
  -DUSE_HSPI_PORT=1                   ; 强开 HSPI 通道

;---LVGL 配置---;
  -DLV_CONF_INCLUDE_SIMPLE=1          ; 告诉 LVGL 直接引用 lv_conf.h
  -I include                          ; 把 include 文件夹加入编译器搜索路径

lib_deps =
    waspinator/AccelStepper
    gin66/FastAccelStepper@^0.30.15
    gin66/FastAccelStepper @ ^0.30.15
    bblanchon/ArduinoJson @ ^7.0.4
    madhephaestus/ESP32Encoder @ ^0.10.1
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@8.3.11
    h2zero/NimBLE-Arduino@^1.4.0

; 排除框架自带的Bluedroid BLE库，使用NimBLE替代
lib_ignore = ESP32 BLE Arduino

; 排除 WebInterface.cpp（已移除Web端，节省SRAM）
build_src_filter = +<*> -<WebInterface.cpp>